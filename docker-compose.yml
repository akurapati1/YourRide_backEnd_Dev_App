# Local PostgreSQL + PostGIS (the app uses spatial queries for driver matching)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: yourride
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
