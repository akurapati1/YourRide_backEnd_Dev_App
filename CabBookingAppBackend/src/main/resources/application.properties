spring.application.name=CabBookingAppBackend

# ---- Database (override with environment variables; never commit real credentials) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yourride}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# "update" keeps data between restarts. Use "create" only for throw-away local databases.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# ---- SMTP (ride notification e-mails) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- JWT ----
# JWT_SECRET must be set (>= 32 characters). The application refuses to start without it.
jwt.secretKey=${JWT_SECRET}
jwt.accessTokenMinutes=${JWT_ACCESS_MINUTES:10}
jwt.refreshTokenDays=${JWT_REFRESH_DAYS:30}
# Set to true when serving over HTTPS so the refresh cookie is marked Secure
app.cookie.secure=${COOKIE_SECURE:false}
